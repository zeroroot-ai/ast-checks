name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod
          # go.sum is only present when there are non-stdlib deps; check it if present.
          test ! -f go.sum || git diff --exit-code go.sum

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race)
        run: go test -race ./...

      # This repo eats its own output (ast-checks#11 is its tracker). The
      # baseline only shrinks, so a new declaration nothing reads fails here.
      - name: lint-unwired
        run: make lint-unwired

      # The whole-program dead-code floor (ADR-0094, .github#160). The org action
      # is the one implementation. The pin comes from the Makefile, so a
      # developer's `make lint-deadcode` and this step cannot run different tools.
      - name: deadcode pin (from the Makefile)
        id: deadcode
        run: echo "version=$(make -s deadcode-version)" >> "$GITHUB_OUTPUT"
      - name: lint-deadcode
        uses: zeroroot-ai/.github/actions/deadcode-gate@76842051ca980d343fe51b131a8e345db7e2c6b7 # v0.10.0
        with:
          version: ${{ steps.deadcode.outputs.version }}
          allowlist: scripts/deadcode-allow.txt
      - name: lint-deadcode can fail
        run: make lint-deadcode-selftest

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
